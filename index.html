<meta charset="utf-8">
<title>Jardim Suspenso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito:wght@600;700;800;900&display=swap">
<style>
  :root {
    color-scheme: light;
    --tinta: #1f2e2b;
    --tinta-2: #4d5f5a;
    --vidro: rgba(250, 252, 248, 0.74);
    --vidro-borda: rgba(255, 255, 255, 0.7);
    --sombra: 0 10px 30px rgba(18, 40, 44, 0.18);
    --broto: #2f7d62;
    --broto-claro: #dcefe4;
    --sol: #f2b84b;
    --papel: #fbfaf5;
    --comum: #7a8a84;
    --incomum: #2f8a5f;
    --rara: #3f67c9;
    --lendaria: #a8559b;
    --f-titulo: "Young Serif", Georgia, "Times New Roman", serif;
    --f-ui: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #8fb8d8; }
  body {
    font-family: var(--f-ui); color: var(--tinta);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #cena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 2.5px solid var(--broto); outline-offset: 2px; }
  .vidro {
    background: var(--vidro);
    -webkit-backdrop-filter: blur(14px) saturate(1.35); backdrop-filter: blur(14px) saturate(1.35);
    border: 1px solid var(--vidro-borda); box-shadow: var(--sombra);
  }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0; pointer-events: none;
  }
  #hud > * { pointer-events: auto; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 15px 0 10px;
    border-radius: 999px; font-weight: 900; font-size: 14.5px; font-variant-numeric: tabular-nums;
  }
  .chip svg { width: 24px; height: 24px; flex: none; }
  .chip .sep { opacity: 0.35; font-weight: 700; }
  .chip #diaN { font-weight: 800; color: var(--tinta-2); }
  .hud-dir { display: flex; gap: 8px; }
  .redondo { width: 42px; height: 42px; border-radius: 999px; display: grid; place-items: center; }
  .redondo svg { width: 20px; height: 20px; }
  .redondo.desligado { color: #8a9692; }

  #avisos {
    position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 9;
    display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 16px;
  }
  .aviso {
    border-radius: 16px; padding: 8px 14px 8px 10px; font-size: 14px; font-weight: 800; max-width: 100%;
    display: flex; align-items: center; gap: 10px; animation: avisoEntra 0.4s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .aviso .ic { width: 30px; height: 30px; flex: none; display: grid; place-items: center; }
  .aviso .ic svg { width: 30px; height: 30px; }
  .aviso small { display: block; font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--broto); font-weight: 900; }
  .aviso.sai { animation: avisoSai 0.45s ease forwards; }
  @keyframes avisoEntra { from { opacity: 0; transform: translateY(-10px) scale(0.96); } }
  @keyframes avisoSai { to { opacity: 0; transform: translateY(-8px); } }

  #dica {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 6;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 100px);
    padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 800; text-align: center;
    width: max-content; max-width: calc(100% - 32px); pointer-events: none; transition: bottom 0.3s ease, opacity 0.4s ease;
  }
  body.com-bandeja #dica { bottom: calc(env(safe-area-inset-bottom, 0px) + 282px); }

  /* ---------- Doca de ferramentas ---------- */
  #doca {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 7;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    width: min(460px, calc(100% - 24px)); padding: 6px; border-radius: 24px;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
  }
  .ferr {
    height: 60px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 11.5px; font-weight: 900; color: var(--tinta-2); transition: background 0.2s ease, color 0.2s ease, transform 0.1s ease;
  }
  .ferr svg { width: 25px; height: 25px; }
  .ferr[aria-pressed="true"] { background: var(--broto); color: #fff; }
  .ferr:active { transform: scale(0.94); }

  /* ---------- Bandeja (sementes / decoração) ---------- */
  #bandeja {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 6;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
    width: min(460px, calc(100% - 24px)); border-radius: 22px; padding: 11px 0 10px;
    animation: bandejaSobe 0.3s cubic-bezier(.2,.9,.3,1.1);
  }
  @keyframes bandejaSobe { from { opacity: 0; transform: translate(-50%, 12px); } }
  .bandeja-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 0 14px 8px; }
  .bandeja-cab b { font-family: var(--f-titulo); font-weight: 400; font-size: 17px; }
  .bandeja-cab span { font-size: 12.5px; color: var(--tinta-2); font-weight: 800; text-align: right; }
  .bandeja-lista { display: flex; gap: 8px; overflow-x: auto; padding: 2px 14px 4px; scroll-snap-type: x proximity; scrollbar-width: none; }
  .bandeja-lista::-webkit-scrollbar { display: none; }
  .carta {
    flex: 0 0 76px; position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 7px 4px 7px; border-radius: 15px; background: rgba(255, 255, 255, 0.6);
    font-size: 11.5px; font-weight: 900; line-height: 1.15; text-align: center; scroll-snap-align: start;
  }
  .carta svg { width: 44px; height: 44px; }
  .carta small { font-size: 10.5px; font-weight: 800; color: var(--tinta-2); }
  .carta[aria-pressed="true"] { background: #fff; box-shadow: inset 0 0 0 2.5px var(--broto); }
  .carta.trancada { background: rgba(255, 255, 255, 0.3); color: var(--tinta-2); }
  .carta.trancada svg { filter: grayscale(1) opacity(0.4); }
  .carta .qtd {
    position: absolute; top: 4px; right: 5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
    background: var(--broto); color: #fff; font-size: 11px; display: grid; place-items: center;
  }
  .bandeja-sep { flex: 0 0 1.5px; align-self: stretch; margin: 6px 3px; background: rgba(31, 46, 43, 0.14); border-radius: 2px; }
  .bandeja-vazia { font-size: 13px; color: var(--tinta-2); font-weight: 700; padding: 10px 4px; align-self: center; white-space: nowrap; }

  /* ---------- Bolha contextual ---------- */
  #bolha {
    position: fixed; z-index: 8; left: 0; top: 0; transform: translate(-50%, calc(-100% - 16px));
    border-radius: 18px; padding: 11px 13px 12px; width: max-content; min-width: 160px; max-width: min(290px, calc(100vw - 32px));
  }
  #bolha h4 { margin: 0; font-family: var(--f-titulo); font-weight: 400; font-size: 16.5px; line-height: 1.2; }
  #bolha p { margin: 3px 0 0; font-size: 13.5px; color: var(--tinta-2); line-height: 1.4; font-weight: 700; }
  #bolha .barra { height: 6px; border-radius: 6px; background: rgba(31, 46, 43, 0.1); margin-top: 8px; overflow: hidden; }
  #bolha .barra i { display: block; height: 100%; background: var(--broto); border-radius: 6px; }
  .bolha-bts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .bt { height: 38px; padding: 0 15px; border-radius: 999px; font-weight: 900; font-size: 13.5px; background: rgba(31, 46, 43, 0.08); }
  .bt.forte { background: var(--broto); color: #fff; }
  .bt.perigo { background: #b64a3c; color: #fff; }

  /* ---------- Painéis (caderno, achado) ---------- */
  .painel { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(14, 30, 34, 0.38); }
  .folha {
    width: 100%; max-width: 560px; max-height: 88%; display: flex; flex-direction: column;
    background: var(--papel); border-radius: 24px 24px 0 0; box-shadow: 0 -14px 44px rgba(0, 0, 0, 0.25);
    padding-bottom: env(safe-area-inset-bottom, 0px); animation: sobe 0.35s cubic-bezier(.2,.9,.3,1.05);
  }
  @keyframes sobe { from { transform: translateY(50px); opacity: 0; } }
  .folha-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 16px 12px; }
  .folha-cab h2 { margin: 0; font-family: var(--f-titulo); font-weight: 400; font-size: 25px; line-height: 1.1; text-wrap: balance; }
  .folha-cab p { margin: 4px 0 0; font-size: 13px; color: var(--tinta-2); font-weight: 800; font-variant-numeric: tabular-nums; }
  .fechar { width: 40px; height: 40px; border-radius: 999px; background: rgba(31, 46, 43, 0.08); display: grid; place-items: center; flex: none; }
  .fechar svg { width: 18px; height: 18px; }
  .abas { display: flex; gap: 6px; padding: 0 16px 12px; }
  .aba { flex: 1; height: 40px; border-radius: 13px; font-weight: 900; font-size: 13.5px; background: rgba(31, 46, 43, 0.06); color: var(--tinta-2); }
  .aba span { font-weight: 800; opacity: 0.7; margin-left: 3px; font-variant-numeric: tabular-nums; }
  .aba[aria-selected="true"] { background: var(--tinta); color: #fff; }
  .folha-corpo { overflow-y: auto; padding: 2px 16px 20px; display: grid; gap: 8px; -webkit-user-select: text; user-select: text; overscroll-behavior: contain; }
  .entrada {
    display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: start;
    padding: 11px; border-radius: 16px; background: #fff; border: 1px solid rgba(31, 46, 43, 0.07);
  }
  .entrada .ico { width: 54px; height: 54px; border-radius: 13px; display: grid; place-items: center; background: #eef4ef; }
  .entrada .ico svg { width: 42px; height: 42px; }
  .entrada h3 { margin: 1px 0 0; font-size: 15.5px; font-weight: 900; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; line-height: 1.25; }
  .entrada p { margin: 3px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--tinta-2); font-weight: 600; max-width: 62ch; }
  .entrada .meta { font-size: 12px; font-weight: 800; color: var(--broto); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .entrada.falta { background: transparent; border: 1.5px dashed rgba(31, 46, 43, 0.2); }
  .entrada.falta .ico { background: rgba(31, 46, 43, 0.05); }
  .entrada.falta .ico svg { filter: grayscale(1) opacity(0.3); }
  .entrada.falta h3 { color: var(--tinta-2); }
  details.entrada { display: block; padding: 0; }
  details.entrada summary { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; padding: 11px; cursor: pointer; list-style: none; }
  details.entrada summary::-webkit-details-marker { display: none; }
  details.entrada summary .seta { width: 18px; height: 18px; color: var(--tinta-2); transition: transform 0.2s ease; }
  details.entrada[open] summary .seta { transform: rotate(180deg); }
  .palavra { font-family: var(--f-titulo); font-size: 14px; color: var(--tinta-2); margin-top: 1px; }
  .cristal-texto { padding: 0 14px 14px 77px; display: grid; gap: 8px; }
  .cristal-texto p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--tinta); font-weight: 600; max-width: 62ch; }
  .cristal-texto .rot { display: block; font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--tinta-2); font-weight: 900; margin-bottom: 2px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 999px; background: #eef2ef; color: var(--tinta-2); }
  .pilula { font-size: 10.5px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; color: #fff; }
  .pilula.comum { background: var(--comum); }
  .pilula.incomum { background: var(--incomum); }
  .pilula.rara { background: var(--rara); }
  .pilula.lendaria { background: linear-gradient(90deg, #a8559b, #5b6fd6); }
  .rodape-caderno { font-size: 12.5px; color: var(--tinta-2); font-weight: 800; text-align: center; padding: 6px 0 0; font-variant-numeric: tabular-nums; }

  /* Cartão de cristal encontrado */
  #achado { align-items: center; padding: 16px; }
  .cartao {
    width: min(380px, 100%); max-height: 100%; overflow-y: auto; background: var(--papel); border-radius: 26px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35); animation: cartaoEntra 0.5s cubic-bezier(.2,.9,.3,1.15);
  }
  @keyframes cartaoEntra { from { opacity: 0; transform: scale(0.9) translateY(20px); } }
  .cartao-topo { position: relative; display: grid; place-items: center; padding: 26px 16px 10px; border-radius: 26px 26px 0 0; overflow: hidden; }
  .cartao-topo::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 55%, var(--aura, #cfe6ff) 0%, transparent 62%); opacity: 0.75; }
  .cartao-topo svg { position: relative; width: 116px; height: 116px; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.18)); animation: flutua 3.2s ease-in-out infinite; }
  @keyframes flutua { 50% { transform: translateY(-6px) rotate(2deg); } }
  .cartao-corpo { padding: 4px 20px 20px; display: grid; gap: 10px; }
  .cartao-corpo .sobre { text-align: center; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 900; color: var(--broto); }
  .cartao-corpo h2 { margin: 0; text-align: center; font-family: var(--f-titulo); font-weight: 400; font-size: 28px; line-height: 1.1; }
  .cartao-corpo .centro { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .cartao-corpo .grande { text-align: center; font-family: var(--f-titulo); font-size: 19px; color: var(--tinta-2); }
  .cartao-corpo p { margin: 0; font-size: 14.5px; line-height: 1.55; font-weight: 600; }
  .cartao-corpo .rot { display: block; font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--tinta-2); font-weight: 900; margin-bottom: 2px; }
  .cartao-bts { display: flex; gap: 8px; margin-top: 4px; }
  .cartao-bts .bt { flex: 1; height: 46px; font-size: 14.5px; }

  /* ---------- Abertura ---------- */
  #abertura {
    position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; justify-content: space-between;
    padding: calc(env(safe-area-inset-top, 0px) + 44px) 16px calc(env(safe-area-inset-bottom, 0px) + 40px);
    background: linear-gradient(to bottom, rgba(10, 28, 40, 0.5) 0%, rgba(10, 28, 40, 0) 34%, rgba(10, 28, 40, 0) 58%, rgba(10, 28, 40, 0.6) 100%);
    color: #fff; transition: opacity 1s ease;
  }
  #abertura.some { opacity: 0; pointer-events: none; }
  .abre-topo { text-align: center; display: grid; gap: 10px; justify-items: center; }
  .abre-topo h1 { margin: 0; font-family: var(--f-titulo); font-weight: 400; font-size: clamp(44px, 13vw, 76px); line-height: 0.95; letter-spacing: -0.01em; text-shadow: 0 4px 24px rgba(0, 20, 40, 0.35); text-wrap: balance; }
  .abre-topo p { margin: 0; font-size: 16.5px; line-height: 1.45; max-width: 30ch; font-weight: 700; text-shadow: 0 2px 12px rgba(0, 20, 40, 0.45); text-wrap: pretty; }
  .abre-base { display: grid; gap: 10px; justify-items: center; }
  #entrar { height: 56px; padding: 0 32px; border-radius: 999px; background: #fff; color: var(--tinta); font-weight: 900; font-size: 17px; box-shadow: 0 12px 30px rgba(0, 20, 40, 0.3); }
  #entrar:active { transform: scale(0.97); }
  .abre-base small { font-size: 13px; font-weight: 700; opacity: 0.9; text-shadow: 0 2px 10px rgba(0, 20, 40, 0.5); }

  @media (prefers-reduced-motion: reduce) {
    .aviso, .folha, .cartao, #bandeja, .cartao-topo svg { animation: none !important; }
  }
</style>

<canvas id="cena" aria-label="Ilha flutuante com jardim em 3D"></canvas>

<header id="hud" hidden>
  <button class="chip vidro" id="chipTempo" aria-label="Tempo e clima">
    <span id="icoClima"></span><span id="relogio">07:30</span><span class="sep">·</span><span id="diaN">Dia 1</span>
  </button>
  <div class="hud-dir">
    <button class="redondo vidro" id="btMusica" aria-label="Desligar música"></button>
    <button class="redondo vidro" id="btSom" aria-label="Desligar som"></button>
  </div>
</header>

<div id="avisos" aria-live="polite"></div>
<div id="dica" class="vidro" hidden></div>

<div id="bandeja" class="vidro" hidden>
  <div class="bandeja-cab"><b id="bandejaTitulo">Sementes</b><span id="bandejaSub"></span></div>
  <div class="bandeja-lista" id="bandejaLista"></div>
</div>

<nav id="doca" class="vidro" hidden aria-label="Ferramentas">
  <button class="ferr" data-ferr="mao" aria-pressed="true"><span class="i"></span>Olhar</button>
  <button class="ferr" data-ferr="semear" aria-pressed="false"><span class="i"></span>Semear</button>
  <button class="ferr" data-ferr="regar" aria-pressed="false"><span class="i"></span>Regar</button>
  <button class="ferr" data-ferr="decorar" aria-pressed="false"><span class="i"></span>Decorar</button>
  <button class="ferr" data-ferr="caderno" aria-pressed="false"><span class="i"></span>Caderno</button>
</nav>

<div id="bolha" class="vidro" hidden></div>

<section id="caderno" class="painel" hidden>
  <div class="folha" role="dialog" aria-modal="true" aria-labelledby="cadTitulo">
    <div class="folha-cab">
      <div><h2 id="cadTitulo">Caderno do jardim</h2><p id="cadResumo"></p></div>
      <button class="fechar" id="cadFechar" aria-label="Fechar caderno"></button>
    </div>
    <div class="abas" role="tablist">
      <button class="aba" role="tab" data-aba="plantas" aria-selected="true">Plantas<span id="nPlantas"></span></button>
      <button class="aba" role="tab" data-aba="cristais" aria-selected="false">Cristais<span id="nCristais"></span></button>
      <button class="aba" role="tab" data-aba="bichos" aria-selected="false">Visitantes<span id="nBichos"></span></button>
    </div>
    <div class="folha-corpo" id="cadCorpo"></div>
  </div>
</section>

<section id="achado" class="painel" hidden>
  <div class="cartao" role="dialog" aria-modal="true" aria-labelledby="achNome">
    <div class="cartao-topo" id="achTopo"></div>
    <div class="cartao-corpo">
      <span class="sobre" id="achSobre">Você encontrou</span>
      <h2 id="achNome"></h2>
      <div class="centro" id="achTags"></div>
      <div class="grande" id="achPalavra"></div>
      <p id="achSig"></p>
      <p><span class="rot">Na tradição</span><span id="achUso"></span></p>
      <div class="cartao-bts">
        <button class="bt" id="achGuardar">Guardar</button>
        <button class="bt forte" id="achColocar">Colocar no jardim</button>
      </div>
    </div>
  </div>
</section>

<div id="abertura">
  <div class="abre-topo">
    <h1>Jardim Suspenso</h1>
    <p>Uma ilhota no céu para plantar, regar e ver crescer com calma.</p>
  </div>
  <div class="abre-base">
    <button id="entrar">Entrar no jardim</button>
    <small>Melhor com fones de ouvido.</small>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
'use strict';

/* =========================================================
   Utilidades
   ========================================================= */
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const suave = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const rnd = (a, b) => a + Math.random() * (b - a);
const escolhe = a => a[(Math.random() * a.length) | 0];
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeBack = t => { t = clamp(t, 0, 1); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

function raioIlha(th) { return 6.9 + 0.55 * Math.sin(3 * th + 0.8) + 0.3 * Math.sin(5 * th + 2.1) + 0.18 * Math.sin(9 * th + 0.3); }

  sh.fragmentShader = 'uniform float uTempo; uniform vec4 uRip[6]; varying vec3 vMundo;\n' + sh.fragmentShader.replace('#include <normal_fragment_maps>', `

function matFluxo(vel, fade) {
  return new THREE.ShaderMaterial({
    uniforms: { uTempo: U.tempo, uCor: { value: lin('#cfeef5').clone() }, uLuz: { value: 1 }, uVel: { value: vel }, uFade: { value: fade } },
    vertexShader: VERT_UV,
    fragmentShader: GLSL_RUIDO + `
      uniform float uTempo, uLuz, uVel, uFade; uniform vec3 uCor; varying vec2 vUv;
      void main(){
        float n1 = rdo(vec2(vUv.x * 9.0, vUv.y * 5.0 - uTempo * uVel));
        float n2 = rdo(vec2(vUv.x * 23.0 + 3.0, vUv.y * 11.0 - uTempo * uVel * 1.4));
        float s = n1 * 0.6 + n2 * 0.4;
        float borda = smoothstep(0.0, 0.22, vUv.x) * smoothstep(1.0, 0.78, vUv.x);
        float fim = mix(1.0, 1.0 - smoothstep(0.4, 1.0, vUv.y), uFade);
        float a = (0.32 + 0.68 * smoothstep(0.25, 0.8, s)) * borda * fim;
        vec3 c = mix(uCor * 0.75, vec3(1.0), smoothstep(0.45, 0.9, s)) * uLuz;
        gl_FragColor = vec4(c, a * 0.88);
      }`,
    transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: false,
  });
}
function faixaGeo(pontos, perp) {

    pos.push(pt.p.x - perp.x * pt.w, pt.p.y, pt.p.z - perp.z * pt.w, pt.p.x + perp.x * pt.w, pt.p.y, pt.p.z + perp.z * pt.w);
    const v = i / (n - 1); uv.push(0, v, 1, v);
    if (i < n - 1) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }

  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));

}

function checaLugar(x, z, raio, agua, ignora) {
  if (agua) {

  } else {
    if (!dentroDaIlha(x, z, 0.5)) return 'Muito perto da beirada.';
    if (hTerreno(x, z) < NIVEL + 0.05) return 'Aqui é água. Só a vitória-régia nasce no lago.';
    canalCalc(x, z); if (_cd < 0.5) return 'Aqui passa o riacho.';
  }
  for (const p of plantas) if (p !== ignora && Math.hypot(p.d.x - x, p.d.z - z) < (raio + RAIO_PORTE[p.e.porte]) * 0.8) return 'Muito perto de outra planta.';
  for (const o of decors) if (o !== ignora && Math.hypot(o.d.x - x, o.d.z - z) < (raio + o.raio) * 0.8) return 'Já tem uma decoração aqui.';
  for (const g of geodos) if (Math.hypot(g.x - x, g.z - z) < raio + 0.35) return 'Tem algo brilhando aqui. Toque para desenterrar.';

}

let _gid = 0;
function iconeCristal(c) {
  const id = 'c' + (_gid++), cl = tomHex(c.cor, 0.12), es = tomHex(c.cor, -0.2), cor = c.cor;
  const ponta = (cx, by, w, h, tip, rot = 0) => {
    const x0 = cx - w, x1 = cx + w, yT = by - h, yP = yT - tip;
    return `<g transform="rotate(${rot} ${cx} ${by})"><polygon points="${x0},${by} ${x0},${yT} ${cx},${yP} ${cx},${by + 2}" fill="${cl}"/><polygon points="${cx},${by + 2} ${cx},${yP} ${x1},${yT} ${x1},${by}" fill="${es}"/><polygon points="${x0},${yT} ${cx},${yP} ${cx},${yT + 3}" fill="#ffffff" opacity=".4"/></g>`;
  };
  const rocha = '<ellipse cx="24" cy="41" rx="15" ry="5" fill="#77726b"/>';
  const cubo = (x, y, s) => `<polygon points="${x},${y - s} ${x + s},${y - s / 2} ${x},${y} ${x - s},${y - s / 2}" fill="${cl}"/><polygon points="${x - s},${y - s / 2} ${x},${y} ${x},${y + s} ${x - s},${y + s / 2}" fill="${cor}"/><polygon points="${x + s},${y - s / 2} ${x},${y} ${x},${y + s} ${x + s},${y + s / 2}" fill="${es}"/>`;
  let s = '';
  switch (c.forma) {
    case 'ponta': s = rocha + ponta(16, 40, 4, 12, 5, -25) + ponta(33, 40, 4, 11, 5, 28) + ponta(24, 41, 6, 22, 8); break;
    case 'drusa': s = '<path d="M5 40c2-10 10-16 19-16s17 6 19 16z" fill="#6f6a63"/>' + [[12, 38, -30], [17, 36, -12], [23, 35, 0], [29, 36, 12], [35, 38, 30], [20, 39, -5], [27, 39, 6]].map(([x, y, r]) => ponta(x, y, 2.6, 7 + (x % 3) * 2, 3.5, r)).join(''); break;
    case 'prisma': s = ponta(18, 42, 4.5, 22, c.id === 'turmalina' ? 3 : 1.5, -12) + ponta(28, 43, 5.5, 30, c.id === 'turmalina' ? 3 : 1.5, 6); break;
    case 'torre': s = ponta(24, 44, 5, 30, 6) + `<g stroke="${es}" stroke-width=".6" opacity=".6"><path d="M20 16v26M22 14v29M26 14v29M28 16v26"/></g>`; break;
    case 'bruta': s = `<polygon points="8,38 14,20 26,14 38,20 42,36 28,42" fill="${cor}"/><polygon points="14,20 26,14 24,28" fill="${cl}"/><polygon points="26,14 38,20 24,28" fill="${tomHex(c.cor, 0.05)}"/><polygon points="24,28 38,20 42,36 28,42" fill="${es}"/><polygon points="8,38 14,20 24,28 28,42" fill="${tomHex(c.cor, -0.08)}"/>`; break;
    case 'cubos': s = rocha + cubo(17, 30, 8) + cubo(31, 32, 7) + cubo(24, 22, 9); break;
    case 'octaedro': s = `<polygon points="24,4 38,24 24,44 10,24" fill="${cor}"/><polygon points="24,4 10,24 24,26" fill="${cl}"/><polygon points="24,4 38,24 24,26" fill="${es}"/><polygon points="10,24 24,26 24,44" fill="${c.cor2}"/><polygon points="38,24 24,26 24,44" fill="${tomHex(c.cor2, -0.15)}"/>`; break;
    default: {
      let extra = '';
      if (c.tex === 'faixas') extra = `<g clip-path="url(#k${id})" stroke-width="3" fill="none">${[10, 16, 22, 28, 34, 40].map((y, i) => `<path d="M4 ${y}q20 -6 40 0" stroke="${i % 2 ? '#e0ac48' : '#3a2410'}" opacity=".85"/>`).join('')}</g>`;
      else if (c.tex === 'aneis') extra = `<g clip-path="url(#k${id})" fill="none" stroke="#0b4f33" stroke-width="1.6">${[4, 8, 12, 16, 20].map(r => `<ellipse cx="18" cy="26" rx="${r}" ry="${r * 0.7}"/>`).join('')}</g>`;
      else if (c.tex === 'pintas') extra = circulos([[16, 20], [28, 18], [22, 30], [33, 28], [14, 29], [26, 24]], 1.1, ['#e8c65a']);
      else if (c.tex === 'mancha') extra = '<ellipse cx="18" cy="22" rx="6" ry="4" fill="#8fd0a8" opacity=".5"/><ellipse cx="30" cy="30" rx="5" ry="3" fill="#2f7a4c" opacity=".4"/>';
      if (c.iris) extra += `<ellipse cx="24" cy="25" rx="15" ry="11" fill="url(#i${id})" opacity=".75"/>`;
      s = `<defs><radialGradient id="r${id}" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="${cl}"/><stop offset=".6" stop-color="${cor}"/><stop offset="1" stop-color="${c.cor2}"/></radialGradient>
        <linearGradient id="i${id}" x1="0" y1="0" x2="1" y2="1">${c.irisArco > 0.5 ? '<stop offset="0" stop-color="#ff7ad9" stop-opacity=".0"/><stop offset=".3" stop-color="#7affd0"/><stop offset=".55" stop-color="#7ab8ff"/><stop offset=".8" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff7ad9" stop-opacity="0"/>' : c.irisArco > 0 ? '<stop offset="0" stop-color="#2f6fd6" stop-opacity="0"/><stop offset=".4" stop-color="#3fd1ff"/><stop offset=".65" stop-color="#6fe08a"/><stop offset="1" stop-color="#e0c04a" stop-opacity="0"/>' : '<stop offset="0" stop-color="#9fc4ff" stop-opacity="0"/><stop offset=".5" stop-color="#9fc4ff"/><stop offset="1" stop-color="#9fc4ff" stop-opacity="0"/>'}</linearGradient>
        <clipPath id="k${id}"><ellipse cx="24" cy="26" rx="17" ry="12"/></clipPath></defs>
        <ellipse cx="24" cy="38" rx="15" ry="3" fill="#000" opacity=".12"/><ellipse cx="24" cy="26" rx="17" ry="12" fill="url(#r${id})"/>${extra}<ellipse cx="18" cy="20" rx="6" ry="3" fill="#fff" opacity=".45"/>`;
    }
  }
  return `<svg viewBox="0 0 48 48" aria-hidden="true">${s}</svg>`;
}

    const b = document.createElement('button');

const cam = { az: 0.42, pol: 1.02, zoom: 0.8, base: 40, vAz: 0, vPol: 0, desloc: 0 };

  const dist = cam.base * cam.zoom, alvoY = lerp(-1.5, 0.3, clamp((1 - cam.zoom) / 0.6, 0, 1));
  camera.position.set(Math.sin(cam.pol) * Math.sin(cam.az) * dist, alvoY + Math.cos(cam.pol) * dist, Math.sin(cam.pol) * Math.cos(cam.az) * dist);

  for (let i = bichos.length - 1; i >= 0; i--) if (bichos[i].morto) { scene.remove(bichos[i].G); bichos.splice(i, 1); }

  let li = 0;
  for (const o of decors) if (o.luz && o.aceso && li < luzesLanterna.length) {
    const L = luzesLanterna[li++];
    o.G.localToWorld(L.position.copy(o.m.luzPos));
    L.intensity = noite * 1.8 * (0.92 + 0.08 * Math.sin(t * 13 + o.fase) * Math.sin(t * 7.3));
  }
  for (; li < luzesLanterna.length; li++) luzesLanterna[li].intensity = 0;

  // Chuva
  if (chuva > 0.02) {
    linhasChuva.visible = true;
    const inc = vento * 0.35;
    for (let i = 0; i < NCH; i++) {
      const g = gotas[i]; g.y -= g.v * dt;
      if (g.y < -9) { g.y = 14 + Math.random() * 3; g.x = rnd(-14, 14); g.z = rnd(-14, 14); }
      const o = i * 6;
      chuvaPos[o] = g.x; chuvaPos[o + 1] = g.y; chuvaPos[o + 2] = g.z;
      chuvaPos[o + 3] = g.x - inc; chuvaPos[o + 4] = g.y + 0.45; chuvaPos[o + 5] = g.z;
    }
    chuvaGeo.attributes.position.needsUpdate = true;
    chuvaGeo.setDrawRange(0, Math.floor(NCH * chuva) * 2);
    if (Math.random() < chuva * dt * 3) { const q = pontoLago(1.2); onda(q.x, q.z, 0.5); }
    for (let k = 0; k < 2; k++) if (Math.random() < chuva * dt * 14) {
      const q = pontoAr(0, 0), hg = Math.max(hTerreno(q.x, q.z), NIVEL);
      emite(SN, { x: q.x, y: hg + 0.02, z: q.z, vx: rnd(-0.3, 0.3), vy: rnd(0.4, 0.8), vz: rnd(-0.3, 0.3), grav: 5, vida: 0.35, tam: 0.04, cor: lin('#e3f0f7'), forca: 1.2 });
    }
  } else linhasChuva.visible = false;

  // Névoa da cascata
  if (Math.random() < dt * 9) {
    const s = Math.random();
    emite(SN, { x: PE.x + dirC.x * (0.1 + 1.1 * Math.sqrt(s)) + rnd(-0.3, 0.3), y: yLip - 13 * Math.pow(s, 1.45), z: PE.z + dirC.y * (0.1 + 1.1 * Math.sqrt(s)) + rnd(-0.3, 0.3),
      vx: dirC.x * 0.2, vy: -0.4, vz: dirC.y * 0.2, arrasto: 0.4, vida: 2.2, tam: 0.35, cresce: 1.5, cor: lin('#eef7fa'), a: 0.25 * (1 - noite * 0.6), sai: 0.6, entra: 0.4 });
  }

  // Regar segurando
  if (regando && ferramenta === 'regar' && gesto && gesto.tipo === 'talvez') {
    regando.t += dt;
    if (regando.t > 0.3) { regando.cd -= dt; if (regando.cd <= 0) { const p = pontoChao(regando.x, regando.y); if (p) { rega(p, regando.cd < -0.5 || regando.t < 0.4); } regando.cd = 0.25; } }
  }
  if (regadorT > 0) { regadorT -= dt; if (regadorT <= 0) regador.visible = false; }

  atualizaSistema(SN, dt); atualizaSistema(SA, dt); atualizaVagas(t);
  posicionaBolha();

  if (t - ultTexto > 0.5) {
    ultTexto = t;
    const hh = Math.floor(hora), mm = Math.floor((hora - hh) * 60);
    $('relogio').textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    $('diaN').textContent = 'Dia ' + diaN();
    const ec = estadoClima() + (noite > 0.5 ? 'n' : 'd');
    if (ec !== climaTexto) { climaTexto = ec; $('icoClima').innerHTML = iconeClima(estadoClima()); }
  }

  if (sombraCada > 1) renderer.shadowMap.needsUpdate = quadroN % sombraCada === 0;
  composer.render(dt);

  if (comecou && fpsFase < 3) {
    fpsT += bruto; fpsN++;
    if (fpsT > 4) {
      const fps = fpsN / fpsT; fpsT = 0; fpsN = 0;
      if (fps < 42) {
        fpsFase++;
        if (fpsFase === 1) { pr = Math.max(1, pr0 * 0.72); redimensiona(); }
        else if (fpsFase === 2) { bloom.enabled = false; pr = Math.max(1, pr * 0.85); redimensiona(); }
        else { renderer.shadowMap.autoUpdate = false; sombraCada = 3; }
      } else if (fpsN === 0 && fps > 55) fpsFase = 3;
    }
  }
  if (comecou && t - salvoEm > 15) { salvoEm = t; salvar(); }
}
requestAnimationFrame(quadro);
})();
</script>
